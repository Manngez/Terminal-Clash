name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved Terminal Deluxe pixel art archive
        run: |
          if [ -f Paketkriget_Terminal_Deluxe.zip ]; then
            mkdir -p /tmp/terminal-deluxe
            unzip -q -o Paketkriget_Terminal_Deluxe.zip -d /tmp/terminal-deluxe
            ROOT=/tmp/terminal-deluxe/Paketkriget_Terminal_Deluxe
            test -s "$ROOT/game.gd"
            test -s "$ROOT/assets/terminal.png"
            test -s "$ROOT/assets/courier_idle.png"
            test -s "$ROOT/assets/customer_idle.png"
            cp "$ROOT/game.gd" game.gd
            cp "$ROOT/main.tscn" main.tscn
            cp -a "$ROOT/assets/." assets/
            # Keep known-good Android export preset and rendering options.
            sed -i 's/window\/handheld\/orientation=1/window\/handheld\/orientation=0/' project.godot
            echo "TERMINAL DELUXE ASSETS INSTALLED."
            ls -lh assets/terminal.png assets/courier_idle.png assets/customer_idle.png
          elif [ -f Paketkriget_Ritz_Godot.zip ]; then
            echo "Terminal Deluxe archive not uploaded yet; using prior Ritz package."
            mkdir -p /tmp/paketkriget
            unzip -q -o Paketkriget_Ritz_Godot.zip -d /tmp/paketkriget
            cp /tmp/paketkriget/Paketkriget_Godot/game.gd game.gd
            cp /tmp/paketkriget/Paketkriget_Godot/main.tscn main.tscn
            cp -a /tmp/paketkriget/Paketkriget_Godot/assets/. assets/
            python -m pip install --quiet pillow numpy
            python ritz_prepare.py
          else
            echo "No image archive: building repository sources."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          test -d "$ANDROID_HOME/platforms/android-35"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" "$HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Export debug APK
        run: |
          mkdir -p build
          echo "Godot editor settings:"
          cat ~/.config/godot/editor_settings-4.tres
          echo "Android SDK and templates:"
          ls -l "$ANDROID_HOME/build-tools/35.0.0" | head
          ls -l ~/.local/share/godot/export_templates/4.3.stable/android* | head
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/TerminalClash.apk
          test -s build/TerminalClash.apk
          unzip -t build/TerminalClash.apk | tail -2
      - uses: actions/upload-artifact@v4
        with:
          name: TerminalClash-Android-APK
          path: build/TerminalClash.apk
